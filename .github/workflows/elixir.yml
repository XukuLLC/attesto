name: Elixir CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18.1"
            otp: "27.2"
          - elixir: "1.18.4"
            otp: "28.0"
          - elixir: "1.19.4"
            otp: "28.3"
          - elixir: "1.20.1"
            otp: "29.0.2"
            lint: true

    env:
      MIX_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # The cross-language parity tests (@moduletag :parity) drive a real
      # reference Python stack (joserfc + cryptography) IN-PROCESS through
      # erlang_python's :py NIF. That NIF embeds a CPython interpreter, and
      # the bridge starts it in :owngil mode, which the dep only enables on
      # Python >= 3.14 - so the interpreter the NIF links must be 3.14 and
      # must have joserfc + cryptography importable. We pin 3.14 here, install
      # the packages into it, and rebuild erlang_python against it below.
      - name: Set up Python 3.14 (in-process parity stack)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python parity dependencies
        run: python -m pip install --upgrade pip joserfc cryptography

      # The JavaScript parity leg (@moduletag :parity) drives a `jose`
      # reference through a Node worker pool (Attesto.Test.NodeBridge). Node
      # ships on the runner; install the JS deps so the leg runs rather than
      # self-skipping.
      - name: Install Node parity dependencies (jose)
        run: npm install --no-audit --no-fund --prefix test/support/js

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-build-${{ hashFiles('**/mix.lock') }}-${{ hashFiles('**/mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-build-

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Audit dependency advisories
        if: ${{ matrix.lint }}
        run: mix hex.audit

      # Force erlang_python to (re)build its NIF against the Python 3.14 set
      # up above. PYTHON_CONFIG is the documented hint its CMake honours
      # (it derives Python3_ROOT_DIR from `--prefix`). We wipe any cached
      # CMake configure first so a restored deps cache can't pin a stale
      # interpreter, and --force recompiles even on a build-cache hit.
      - name: Build erlang_python against Python 3.14
        env:
          PYTHON_CONFIG: ${{ env.pythonLocation }}/bin/python3.14-config
        run: |
          rm -rf deps/erlang_python/_build/cmake deps/erlang_python/priv/*.so
          mix deps.compile erlang_python --force

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test --trace

      - name: Check formatting
        if: ${{ matrix.lint }}
        run: mix format --check-formatted

      - name: Run Credo
        if: ${{ matrix.lint }}
        run: mix credo --strict

      - name: Restore PLT cache
        if: ${{ matrix.lint }}
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-plt-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-plt-

      - name: Run Dialyzer
        if: ${{ matrix.lint }}
        # dialyxir is `only: [:dev]`, and dev excludes the test-only
        # erlang_python dep and test/support, so dialyzer analyses lib/ alone.
        env:
          MIX_ENV: dev
        run: mix dialyzer

  # attesto declares `:cbor` and `:plug` as `optional: true`. The build & test
  # job above fetches those for attesto's OWN build, so its `--warnings-as-errors`
  # compile always sees the optional-dep modules in their real form and never
  # exercises the raising stubs. A downstream consumer that doesn't pull the
  # optional deps compiles the stubs instead - and any call site that still
  # pattern-matches on a stub's return emits an unreachable-clause warning that
  # is invisible to the main job. This job reproduces that bare-consumer view via
  # the checked-in `.github/no-optional-deps` fixture (path-deps attesto, no
  # optional deps) and fails on any attesto compile warning.
  no-optional-deps:
    name: Compile without optional deps (no :cbor / :plug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.1"
          otp-version: "29.0.2"

      - name: Compile attesto with no optional deps present
        working-directory: .github/no-optional-deps
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          # Compile attesto's dependencies (jose, jason, ...) first so the
          # forced attesto recompile below type-checks against them.
          mix deps.compile
          # Force a clean recompile of attesto ONLY and capture its output. With
          # no optional deps in the tree this walks the stub branches; the output
          # is scoped to attesto, so any `warning:` line is an attesto warning.
          mix deps.compile attesto --force 2>&1 | tee compile.log
          if grep -qE "warning:" compile.log; then
            echo "::error::attesto emitted compile warnings without its optional deps (:cbor / :plug). An optional-dep stub is likely reachable from a call site that pattern-matches its return. See the log above."
            exit 1
          fi
          echo "attesto compiles clean without optional deps."
